name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and official proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install the pinned official Bend checkout
        shell: pwsh
        run: |
          $pin = Get-Content scripts/toolchain.json | ConvertFrom-Json
          git clone --depth 1 --branch $pin.tag $pin.repository .tools/bend
          if ($LASTEXITCODE) { throw 'Could not fetch official Bend' }
          $actual = git -C .tools/bend rev-parse HEAD
          if ($actual -ne $pin.commit) { throw 'Bend tag does not match the pinned commit' }
      - name: Check layout and source syntax
        run: python run.py layout
      - name: Check complete roots and proof inventory
        run: python run.py proofs
      - name: Summarize proof results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out/results/matrix/proof-status.json) {
            Get-Content out/results/matrix/proof-status.json | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          Get-ChildItem out/results -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Output $_.FullName; Get-Content $_.FullName -Tail 12 }

  views:
    name: Native view integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BEND_NO_TELEMETRY: '1'
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned Bend and numerical dependency
        run: |
          python - <<'PY'
          import json, subprocess
          pin = json.load(open('scripts/toolchain.json'))
          subprocess.run(['git', 'clone', '--depth', '1', '--branch', pin['tag'], pin['repository'], '.tools/bend'], check=True)
          actual = subprocess.check_output(['git', '-C', '.tools/bend', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == pin['commit'], 'Bend tag does not match the pinned commit'
          PY
          python -m pip install numpy==2.4.6
      - name: Check public API programs against NumPy
        run: python run.py api
