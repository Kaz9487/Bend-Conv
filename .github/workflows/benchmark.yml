name: Benchmark

# Started by hand. It times the YOLOv5n forward on NumPy, Bend-Conv and
# PyTorch on a hosted runner and writes the report to the job summary.
# A hosted runner is shared hardware: read the numbers as an indication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backends:
    name: YOLOv5n forward, three backends
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      BEND_NO_TELEMETRY: '1'
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install the system library OpenCV needs
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install pinned Bend, the official YOLOv5 source and Python packages
        run: |
          python - <<'PY'
          import json, subprocess
          pin = json.load(open('scripts/toolchain.json'))
          subprocess.run(['git', 'clone', '--depth', '1', '--branch', pin['tag'], pin['repository'], '.tools/bend'], check=True)
          actual = subprocess.check_output(['git', '-C', '.tools/bend', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == pin['commit'], 'Bend tag does not match the pinned commit'
          PY
          git clone --depth 1 --branch v7.0 https://github.com/ultralytics/yolov5.git .tools/yolov5-official
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt threadpoolctl==3.7.0
      - name: Measure
        run: python run.py backends
      - name: Report
        if: always()
        run: |
          {
            echo '### Machine'
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core'
            clang --version | head -1
            echo '```'
            if [ -f out/results/backend_comparison.md ]; then
              sed -n '/^| Backend/,/^$/p' out/results/backend_comparison.md
            fi
            echo '### Samples (seconds)'
            echo '```'
            for name in bend_cpu bend_cpu_4t numpy_1t numpy_4t torch_cpu_1t torch_cpu_4t; do
              file="out/results/backends/$name/timing.json"
              if [ -f "$file" ]; then printf '%s ' "$name"; python -c "import json,sys; print(json.load(open(sys.argv[1]))['seconds'])" "$file"; fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
